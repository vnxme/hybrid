name: Fuzz

on:
  schedule:
    - cron: '0 7 * * 1' # Weekly, as tests run only the seeds
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    name: Fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {package: ., target: FuzzSplit}
          - {package: ., target: FuzzAddr}
          - {package: ./internal/pktinfo, target: FuzzParse}
          - {package: ./internal/pktinfo, target: FuzzMarshal}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false # The build cache, saved once per go.sum, would hold a stale corpus; it's cached below
      - name: Locate the fuzz cache, which holds the corpus generated so far
        id: cache-dir
        run: echo "dir=$(go env GOCACHE)/fuzz" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.cache-dir.outputs.dir }}
          key: fuzz-${{ matrix.target }}-${{ github.run_id }} # Saved anew each run, so that the corpus grows
          restore-keys: fuzz-${{ matrix.target }}-
      - name: Fuzz
        run: go test -run '^$' -fuzz '^${{ matrix.target }}$' -fuzztime 5m ${{ matrix.package }}
      - name: Upload the failing input, which go test has written into testdata
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}-failing-input
          path: '**/testdata/fuzz/'
