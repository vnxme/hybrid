name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }}, Go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.26.x', stable] # The minimum of go.mod, and the latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - name: Test
        if: runner.os != 'Windows'
        run: go test -race -count=1 ./...
      - name: Test without the race detector, which needs cgo on Windows
        if: runner.os == 'Windows'
        run: go test -count=1 ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0

  vet:
    name: Vet (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: # The platforms with code of their own that no test job runs; zos has no port in the gc toolchain
          - {goos: freebsd, goarch: amd64}
          - {goos: openbsd, goarch: amd64}
          - {goos: netbsd, goarch: amd64}
          - {goos: dragonfly, goarch: amd64}
          - {goos: solaris, goarch: amd64}
          - {goos: illumos, goarch: amd64}
          - {goos: aix, goarch: ppc64}
          - {goos: plan9, goarch: amd64}
          - {goos: js, goarch: wasm}
          - {goos: wasip1, goarch: wasm}
          - {goos: linux, goarch: '386'} # 32-bit
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Vet, which builds the tests too
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go vet ./...
