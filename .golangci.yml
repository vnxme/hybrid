version: "2"
run:
  issues-exit-code: 1
  tests: false
  build-tags: []
output:
  formats:
    text:
      path: stdout
      print-linter-name: true
      print-issued-lines: true
linters:
  default: none
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - copyloopvar
    - decorder
    - depguard
    - dogsled
    - dupl
    - dupword
    - durationcheck
    - errcheck
    - errname
    - exhaustive
    - gosec
    - govet
    - importas
    - ineffassign
    - misspell
    - nolintlint
    - prealloc
    - promlinter
    - sloglint
    - sqlclosecheck
    - staticcheck
    - testableexamples
    - testifylint
    - tparallel
    - unconvert
    - unparam
    - unused
    - usetesting
    - wastedassign
    - whitespace
    - zerologlint
  settings:
    depguard:
      rules:
        system_packages:
          list-mode: strict
          files:
            - "$all"
          allow:
            - "$gostd"
            - "github.com/vnxme/hybrid"
            - "golang.org/x/sys/unix"
            - "golang.org/x/sys/windows"
    govet:
      enable:
        - fieldalignment
    nolintlint:
      require-explanation: true
      require-specific: true
    staticcheck:
      checks: ["all"]
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules: []
    paths: []
formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
  settings:
    gci:
      custom-order: true
      sections:
        - standard
        - default
        - prefix(github.com/vnxme/hybrid)
  exclusions:
    generated: lax
    paths: []
